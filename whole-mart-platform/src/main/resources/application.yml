spring:
  application:
    name: whole-mart-platform
  datasource:
    url: jdbc:h2:mem:wholemart;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
server:
  port: 8080
wholemart:
  security:
    jwt-secret: ${WHOLEMART_JWT_SECRET:local-development-secret-change-before-deploying-12345}
